### ###
# These will be overridden by parameters passed on the CLI via the --config flag
# It is recommended that these variables are mapped in the params: and not accessed directly through the config[] dictionary
### ###

### HPC data organsiation global variables; passed via --config in practise ###
# Empty on purpose. Both workflows refuse to start without a non-empty runtime
# value, and that check only works with nothing here to fall back on: a
# real-looking default would let a forgotten --config silently read, or write
# over, whatever run it names. Example values are kept below as comments.
#
# RUN must be passed via --config parameter at runtime
# eg. 231019_A01439_0219_AHNKGFDRX3
# AKA. $RUN
RUN: ""
# eg. /projects/2026_sequence_production_a/run_data
# AKA. $SEQ_ROOT
IN_ROOT: ""
# The per-run output directory, below the machine-type folder.
# eg. /projects/2026_sequence_production_a/postprocessing/illumina/novaseq/$RUN
# AKA. $OUTPUT_ROOT; must be passed via --config parameter at runtime
OUT_ROOT: ""

### multiQC configuration ###
multiqc_config: "resources/multiQC_config.yaml"


